apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ .Values.name }}"
    environment: "{{ .Values.environment }}"
    version: "{{ .Values.version }}"
spec:
  # ClusterIP only - this must never be reachable from outside the cluster.
  # DNS: {{ .Values.name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
    - name: postgres
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
