apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.name }}-{{ .Values.version }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app: "{{ .Values.name }}"
    environment: "{{ .Values.environment }}"
    version: "{{ .Values.version }}"
data:
  pgbouncer.ini: |
    [databases]
    ; Clients connect to database `{{ .Values.upstream.database }}` on the pooler and get
    ; routed to the real postgres service. No password here - pgbouncer reuses the
    ; credentials from userlist.txt to log into the server.
    {{ .Values.upstream.database }} = host={{ .Values.upstream.host }} port={{ .Values.upstream.port }} dbname={{ .Values.upstream.database }}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = {{ .Values.service.port }}

    auth_type = {{ .Values.pgbouncer.authType }}
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = {{ .Values.pgbouncer.poolMode }}
    max_client_conn = {{ .Values.pgbouncer.maxClientConn }}
    default_pool_size = {{ .Values.pgbouncer.defaultPoolSize }}
    min_pool_size = {{ .Values.pgbouncer.minPoolSize }}
    reserve_pool_size = {{ .Values.pgbouncer.reservePoolSize }}
    reserve_pool_timeout = {{ .Values.pgbouncer.reservePoolTimeout }}
    max_db_connections = {{ .Values.pgbouncer.maxDbConnections }}

    max_prepared_statements = {{ .Values.pgbouncer.maxPreparedStatements }}
    ignore_startup_parameters = {{ .Values.pgbouncer.ignoreStartupParameters }}

    ; `postgres` may query the internal console (SHOW POOLS / SHOW STATS).
    admin_users = postgres
    stats_users = postgres

    log_connections = {{ .Values.pgbouncer.logConnections }}
    log_disconnections = {{ .Values.pgbouncer.logDisconnections }}

    ; Container logs to stderr; no pidfile (pgbouncer runs as PID 1's child).
    logfile =
    pidfile =
