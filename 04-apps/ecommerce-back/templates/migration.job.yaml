apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Values.name }}-migrations-{{ .Values.version }}"
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      initContainers:
      # Wait for postgres to accept connections (postgres is a separate Argo app,
      # so cross-app sync ordering is not guaranteed).
      # Both containers use direct_url - migrations MUST NOT go through pgbouncer,
      # because golang-migrate holds a session-level advisory lock for the whole
      # run and transaction pooling would hand it a different backend mid-flight.
      - name: wait-for-db
        image: postgres:16-alpine
        command: ["sh", "-c"]
        args:
          - |
            until pg_isready -d "$DATABASE_URL"; do
              echo "waiting for postgres..."; sleep 2;
            done
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.secrets.database.direct_url.name }}"
                key: "{{ .Values.secrets.database.direct_url.key }}"
      containers:
      - name: "{{ .Values.name }}-migrations"
        image: "{{ .Values.migrations.image.url }}:{{ .Values.migrations.image.version }}"
        command: ["migrate"]
        args: ["-path", "./migrations", "-database", "$(DATABASE_URL)", "-verbose", "up"]
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.secrets.database.direct_url.name }}"
                key: "{{ .Values.secrets.database.direct_url.key }}"
      restartPolicy: Never
  backoffLimit: 5
